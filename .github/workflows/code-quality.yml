name: Lint & Check Types & Test

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install project and development dependencies
        run: uv sync --all-groups
      - name: Lint (ruff)
        run: uv run ruff check --config=pyproject.toml src/
      - name: Type check (mypy)
        run: uv run mypy --config-file=pyproject.toml src/
      - name: Run tests (pytest)
        run: |
          if find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            uv run pytest -v
          else
            echo "No tests found; skipping pytest."
          fi
